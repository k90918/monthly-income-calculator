name: 更新基金資料

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 讀取 MoneyDJ 最新資料
        run: python3 scripts/update_moneydj.py
      - name: 儲存更新
        run: |
          if git diff --quiet -- data/moneydj.json; then
            echo "資料沒有變化"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/moneydj.json
            git commit -m "更新 MoneyDJ 基金資料"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: 建立靜態網站
        run: |
          mkdir _site
          cp index.html styles.css two-stage.css app.js sw.js manifest.webmanifest .nojekyll _site/
          cp -R src vendor data icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
