name: 更新基金資料

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 讀取 MoneyDJ 最新資料
        run: python3 scripts/update_moneydj.py
      - name: 儲存更新
        run: |
          if git diff --quiet -- data/moneydj.json; then
            echo "資料沒有變化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moneydj.json
          git commit -m "更新 MoneyDJ 基金資料"
          git push
