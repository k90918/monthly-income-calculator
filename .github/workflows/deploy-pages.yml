name: 部署月配息試算器

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 建立靜態網站
        run: |
          mkdir _site
          cp index.html styles.css app.js sw.js manifest.webmanifest .nojekyll _site/
          cp -R src vendor data icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
